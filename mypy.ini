; Type-check configuration for the backend.
;
; Intentionally lenient for now: the backend is typed but not yet mypy-clean
; (~200 findings at introduction). The CI `mypy` step runs in report-only mode
; (continue-on-error) so it surfaces regressions without blocking merges. As the
; findings are burned down, tighten the flags below and flip the CI step to blocking.
; Production-readiness backlog item E3 (formerly .planning/, now local-only).

[mypy]
python_version = 3.12
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
warn_unused_ignores = False
warn_redundant_casts = True
show_error_codes = True
; Do not fail on modules that have no type hints yet.
follow_imports = silent

; Generated Alembic revisions are not worth type-checking.
[mypy-alembic.versions.*]
ignore_errors = True
